<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="kush.css">
</head>

<body>

    <div class="container">
        <h1>🤖 AI Text Summarizer</h1>
        <p>Paste your text and let AI summarize it.</p>

        <textarea id="textInput" placeholder="Paste your text here..."></textarea>

        <button onclick="summarizeText()">Summarize with AI</button>

        <div class="result">
            <h2>AI Summary</h2>
            <p id="summary">Your summary will appear here...</p>
        </div>
    </div>

    <script src="kush.js"></script>
</body>
</html>
